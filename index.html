<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio Agencias BI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --bi-navy-900: #0a1628;
      --bi-navy-800: #0f1f38;
      --bi-navy-700: #162a4a;
      --bi-navy-600: #1e3a5f;
      --bi-navy-500: #2a4d76;
      --bi-gold-400: #d4a843;
      --bi-gold-300: #e0be6a;
      --bi-gold-200: #ebd28f;
      --bi-gold-100: #f5e6b8;
      --bi-gold-glow: rgba(212, 168, 67, 0.12);
      --bi-text-primary: #e8ecf2;
      --bi-text-secondary: #9aa8bd;
      --bi-text-muted: #5a6a82;
      --bi-text-inverse: #0a1628;
      --bi-border: #1c3050;
      --bi-border-light: #243d5e;
      --bi-divider: rgba(28, 48, 80, 0.6);
      --bi-success: #34d399;
      --bi-success-bg: rgba(52, 211, 153, 0.10);
      --bi-warning: #fbbf24;
      --bi-warning-bg: rgba(251, 191, 36, 0.10);
      --bi-error: #f87171;
      --bi-error-bg: rgba(248, 113, 113, 0.10);
      --bi-info: #60a5fa;
      --bi-info-bg: rgba(96, 165, 250, 0.10);
      --bi-radius: 6px;
      --bi-radius-sm: 4px;
      --bi-radius-lg: 10px;
      --bi-transition: 140ms ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bi-navy-900);
      color: var(--bi-text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.4;
    }

    /* ── Header ── */
    .header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--bi-border);
      background: var(--bi-navy-800);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 9px; }
    .header-icon {
      width: 26px; height: 26px;
      background: var(--bi-gold-400);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .header h1 {
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em; color: var(--bi-text-primary);
    }
    .badge {
      background: var(--bi-navy-700);
      color: var(--bi-text-muted);
      font-size: 10px; font-weight: 500;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid var(--bi-border);
    }

    /* ── Toolbar ── */
    .toolbar {
      padding: 8px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--bi-border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .search-row { position: relative; }
    .search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--bi-text-muted); pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 7px 32px 7px 34px;
      background: var(--bi-navy-900); border: 1px solid var(--bi-border);
      border-radius: var(--bi-radius); color: var(--bi-text-primary);
      font-family: inherit; font-size: 12px; outline: none;
      transition: border-color var(--bi-transition), box-shadow var(--bi-transition);
    }
    .search-input::placeholder { color: var(--bi-text-muted); }
    .search-input:focus {
      border-color: var(--bi-gold-400);
      box-shadow: 0 0 0 2px var(--bi-gold-glow);
    }
    .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: var(--bi-navy-700); border: none; color: var(--bi-text-secondary);
      cursor: pointer; width: 18px; height: 18px; border-radius: 50%;
      display: none; align-items: center; justify-content: center; font-size: 11px;
    }
    .clear-btn:hover { background: var(--bi-text-muted); color: var(--bi-text-primary); }

    .filter-row { display: flex; gap: 6px; }
    .filter-select {
      flex: 1; padding: 5px 24px 5px 8px;
      background: var(--bi-navy-900); border: 1px solid var(--bi-border);
      border-radius: var(--bi-radius-sm); color: var(--bi-text-secondary);
      font-family: inherit; font-size: 11px; outline: none;
      cursor: pointer; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6a82' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 8px center;
    }
    .filter-select:focus { border-color: var(--bi-gold-400); }

    /* ── List ── */
    .list-container { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .list-container::-webkit-scrollbar { width: 3px; }
    .list-container::-webkit-scrollbar-track { background: transparent; }
    .list-container::-webkit-scrollbar-thumb { background: var(--bi-border); border-radius: 3px; }

    /* ── Contact Card ── */
    .contact-card { border-bottom: 1px solid var(--bi-divider); }
    .contact-main {
      display: flex; align-items: center; padding: 8px 14px;
      cursor: pointer; gap: 8px;
      transition: background var(--bi-transition);
    }
    .contact-main:hover { background: var(--bi-navy-700); }
    .contact-main:active { background: var(--bi-navy-600); }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; flex-shrink: 0; text-transform: uppercase;
    }
    .av-1{background:rgba(212,168,67,.15);color:#e0be6a}
    .av-2{background:rgba(96,165,250,.15);color:#93bbfd}
    .av-3{background:rgba(52,211,153,.15);color:#6ee7b7}
    .av-4{background:rgba(251,146,60,.15);color:#fdba74}
    .av-5{background:rgba(167,139,250,.15);color:#c4b5fd}
    .av-6{background:rgba(56,189,248,.15);color:#7dd3fc}
    .av-7{background:rgba(244,114,182,.15);color:#f9a8d4}
    .av-8{background:rgba(248,113,113,.15);color:#fca5a5}

    .contact-mid { flex: 1; min-width: 0; }
    .contact-name {
      font-weight: 500; font-size: 13px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; color: var(--bi-text-primary);
    }
    .contact-region {
      font-size: 11px; color: var(--bi-text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .contact-phone {
      font-family: 'IBM Plex Sans', monospace;
      color: var(--bi-gold-400); font-weight: 500; font-size: 12px;
      flex-shrink: 0; cursor: pointer;
      padding: 2px 6px; border-radius: var(--bi-radius-sm);
      transition: background var(--bi-transition);
    }
    .contact-phone:hover {
      background: var(--bi-gold-glow); color: var(--bi-gold-300);
    }

    .chevron {
      color: var(--bi-text-muted); flex-shrink: 0;
      transition: transform 200ms ease; font-size: 9px;
    }
    .contact-card.open .chevron { transform: rotate(90deg); }

    /* ── Detail Panel ── */
    .contact-detail {
      max-height: 0; overflow: hidden;
      transition: max-height 250ms ease;
      background: var(--bi-navy-800);
      border-top: 1px solid var(--bi-divider);
    }
    .contact-card.open .contact-detail { max-height: 400px; }

    .detail-grid {
      padding: 8px 14px 10px 50px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .detail-item { display: flex; flex-direction: column; gap: 1px; }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-label {
      font-size: 10px; color: var(--bi-text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500;
    }
    .detail-value {
      font-size: 12px; color: var(--bi-text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail-value.copyable {
      color: var(--bi-gold-400); cursor: pointer;
    }
    .detail-value.copyable:hover { color: var(--bi-gold-300); text-decoration: underline; }

    /* ── Tags ── */
    .service-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .tag {
      font-size: 10px; padding: 1px 6px;
      border-radius: var(--bi-radius-sm); font-weight: 500; white-space: nowrap;
    }
    .tag-success { background: var(--bi-success-bg); color: var(--bi-success); }
    .tag-warning { background: var(--bi-warning-bg); color: var(--bi-warning); }
    .tag-info { background: var(--bi-info-bg); color: var(--bi-info); }
    .tag-gold { background: var(--bi-gold-glow); color: var(--bi-gold-300); }

    /* ── Empty & Toast ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 20px;
      color: var(--bi-text-muted); text-align: center; gap: 6px;
    }

    .toast {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--bi-success-bg); color: var(--bi-success);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 6px 14px; border-radius: var(--bi-radius);
      font-size: 11px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
      opacity: 0; transition: transform 200ms ease, opacity 200ms ease;
      z-index: 100; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Footer ── */
    .footer {
      padding: 5px 14px; border-top: 1px solid var(--bi-border);
      background: var(--bi-navy-800); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer span { font-size: 10px; color: var(--bi-text-muted); }
    kbd {
      background: var(--bi-navy-700); border: 1px solid var(--bi-border);
      border-radius: 3px; padding: 0px 4px; font-size: 9px;
      font-family: inherit; color: var(--bi-gold-400);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0a1628" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <h1>Directorio Agencias</h1>
    </div>
    <span class="badge" id="countBadge">0</span>
  </div>

  <div class="toolbar">
    <div class="search-row">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar agencia, teléfono, jefe, dirección..." autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn">&times;</button>
    </div>
    <div class="filter-row">
      <select class="filter-select" id="filterRegion"><option value="">Todas las regiones</option></select>
      <select class="filter-select" id="filterDepto"><option value="">Todos los deptos.</option></select>
    </div>
  </div>

  <div class="list-container" id="listContainer"></div>

  <div class="footer">
    <span>Click teléfono = copiar con <kbd>051</kbd></span>
    <span>Actualización Agosto 2025</span>
  </div>

  <div class="toast" id="toast">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastText">Copiado</span>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const listContainer = document.getElementById('listContainer');
    const countBadge = document.getElementById('countBadge');
    const filterRegion = document.getElementById('filterRegion');
    const filterDepto = document.getElementById('filterDepto');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let contactos = [];
    let toastTimeout;

    function avClass(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return'av-'+((Math.abs(h)%8)+1)}
    function initials(n){const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.substring(0,2).toUpperCase()}
    function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

    function svcTags(svcs){
      return svcs.map(s=>{
        if(s==='Microfinanzas')return`<span class="tag tag-success">Microfinanzas</span>`;
        if(s==='Autobanco')return`<span class="tag tag-warning">Autobanco</span>`;
        if(s==='BI Credit')return`<span class="tag tag-gold">BI Credit</span>`;
        if(s.startsWith('ATM:'))return`<span class="tag tag-info">${esc(s)}</span>`;
        return`<span class="tag tag-info">${esc(s)}</span>`;
      }).join('');
    }

    function render(list){
      countBadge.textContent=list.length;
      if(!list.length){listContainer.innerHTML=`<div class="empty-state"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div>No se encontraron resultados</div></div>`;return;}
      let h='';
      list.forEach((c,i)=>{
        const tel=c.telefono||'—';
        const reg=c.region||'';
        const dep=c.departamento?` · ${c.departamento}`:'';
        h+=`<div class="contact-card" id="card-${i}">
          <div class="contact-main" onclick="toggle(${i})">
            <div class="avatar ${avClass(c.nombre)}">${initials(c.nombre)}</div>
            <div class="contact-mid">
              <div class="contact-name" title="${esc(c.nombre)}">${esc(c.nombre)}</div>
              <div class="contact-region">${esc(reg)}${esc(dep)}</div>
            </div>
            <span class="contact-phone" onclick="event.stopPropagation();copiar('${c.telefono}','Tel')" title="Copiar 051${c.telefono}">${tel}</span>
            <span class="chevron">▶</span>
          </div>
          <div class="contact-detail"><div class="detail-grid">
            ${c.extension?`<div class="detail-item"><span class="detail-label">Extensión</span><span class="detail-value copyable" onclick="copyRaw('${c.extension}','Ext')">${c.extension}</span></div>`:''}
            ${c.celular_jefe?`<div class="detail-item"><span class="detail-label">Celular Jefe</span><span class="detail-value copyable" onclick="copiar('${c.celular_jefe}','Cel')">${c.celular_jefe}</span></div>`:''}
            ${c.jefe?`<div class="detail-item full"><span class="detail-label">Jefe de Agencia</span><span class="detail-value">${esc(c.jefe)}</span></div>`:''}
            ${c.email?`<div class="detail-item full"><span class="detail-label">Email</span><span class="detail-value copyable" onclick="copyRaw('${esc(c.email)}','Email')">${esc(c.email)}</span></div>`:''}
            ${c.direccion?`<div class="detail-item full"><span class="detail-label">Dirección</span><span class="detail-value" title="${esc(c.direccion)}">${esc(c.direccion)}</span></div>`:''}
            ${c.horario?`<div class="detail-item full"><span class="detail-label">Horario Lobby</span><span class="detail-value">${esc(c.horario)}</span></div>`:''}
            ${c.servicios&&c.servicios.length?`<div class="detail-item full"><span class="detail-label">Servicios</span><div class="service-tags">${svcTags(c.servicios)}</div></div>`:''}
          </div></div>
        </div>`;
      });
      listContainer.innerHTML=h;
    }

    function toggle(i){document.getElementById('card-'+i).classList.toggle('open')}

    function copiar(tel,label){
      if(!tel)return;
      const num='051'+tel;
      doCopy(num).then(()=>showToast(`${num} copiado`));
    }
    function copyRaw(val,label){
      if(!val)return;
      doCopy(val).then(()=>showToast(`${label} copiado`));
    }
    async function doCopy(text){
      if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}
      else{const t=document.createElement('input');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)}
    }
    function showToast(msg){
      toastText.textContent=msg;toast.classList.add('show');
      clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.classList.remove('show'),1600);
    }

    function applyFilters(){
      const q=searchInput.value.toLowerCase().trim();
      const reg=filterRegion.value;
      const dep=filterDepto.value;
      clearBtn.style.display=q?'flex':'none';
      let list=contactos;
      if(reg)list=list.filter(c=>c.region===reg);
      if(dep)list=list.filter(c=>c.departamento===dep);
      if(q)list=list.filter(c=>(c.nombre||'').toLowerCase().includes(q)||(c.telefono||'').toLowerCase().includes(q)||(c.extension||'').toLowerCase().includes(q)||(c.jefe||'').toLowerCase().includes(q)||(c.direccion||'').toLowerCase().includes(q)||(c.municipio||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q));
      render(list);
    }

    searchInput.addEventListener('input',applyFilters);
    filterRegion.addEventListener('change',applyFilters);
    filterDepto.addEventListener('change',applyFilters);
    clearBtn.addEventListener('click',()=>{searchInput.value='';clearBtn.style.display='none';searchInput.focus();applyFilters()});

    document.addEventListener('keydown',e=>{
      if((e.ctrlKey&&e.key==='k')||(e.key==='/'&&document.activeElement!==searchInput)){e.preventDefault();searchInput.focus();searchInput.select()}
      if(e.key==='Escape'){searchInput.value='';clearBtn.style.display='none';filterRegion.value='';filterDepto.value='';searchInput.blur();applyFilters()}
    });

    function populateFilters(){
      const regions=[...new Set(contactos.map(c=>c.region).filter(Boolean))].sort();
      const deptos=[...new Set(contactos.map(c=>c.departamento).filter(Boolean))].sort();
      regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;filterRegion.appendChild(o)});
      deptos.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;filterDepto.appendChild(o)});
    }
